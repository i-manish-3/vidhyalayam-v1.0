name: Deploy Vidhyalayam to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Dry Run Build Verification
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  deploy-to-azure:
    name: Deploy to Azure Linux VM
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script_stop: true
          script: |
            echo "========================================="
            echo "1. VERIFYING REDIS SERVICE (COMPULSORY)"
            echo "========================================="
            if ! redis-cli ping | grep -q "PONG"; then
              echo "Redis is not running! Attempting restart via systemctl..."
              sudo systemctl restart redis-server
              sleep 2
              redis-cli ping | grep -q "PONG" || { echo "Fatal: Redis failed to start!"; exit 1; }
            fi
            echo "Redis server is up and responsive."

            echo "========================================="
            echo "2. UPDATING APPLICATION CODE"
            echo "========================================="
            cd /var/www/vidhyalayam
            git fetch origin main
            git reset --hard origin/main

            echo "========================================="
            echo "3. INSTALLING DEPENDENCIES"
            echo "========================================="
            npm install --prefer-offline --no-audit

            echo "========================================="
            echo "4. RUNNING PRISMA GENERATE & DB SYNC"
            echo "========================================="
            npx prisma generate
            npx prisma db push --accept-data-loss

            echo "========================================="
            echo "5. BUILDING NEXT.JS APPLICATION"
            echo "========================================="
            npm run build

            echo "========================================="
            echo "6. RELOADING PM2 APP & REDIS WORKERS"
            echo "========================================="
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "========================================="
            echo "7. POST-DEPLOYMENT HEALTH CHECKS"
            echo "========================================="
            sleep 4

            echo "Checking Next.js web server on port 3000..."
            curl -f http://127.0.0.1:3000 > /dev/null || { echo "Web server health check failed!"; exit 1; }

            echo "Verifying all PM2 processes are online..."
            for process_name in vidhyalayam worker-demand worker-notifications worker-exports worker-audit; do
              if ! pm2 describe "$process_name" | grep -q "online"; then
                echo "Fatal: Process $process_name is not online!"
                pm2 logs "$process_name" --lines 20
                exit 1
              fi
              echo "Process $process_name is online."
            done

            echo "========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "========================================="
