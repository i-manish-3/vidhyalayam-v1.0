name: Deploy Vidhyalayam to Azure VM

on:
  push:
    branches:
      - main
      - test-deploy
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Dry Run Build Verification
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: "ci_build_dummy_jwt_secret_at_least_32_characters_long_for_nextjs"
          DATABASE_URL: "postgresql://ci_dummy:ci_dummy@127.0.0.1:5432/ci_dummy"

  deploy-to-azure:
    name: Deploy to Azure Linux VM
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-deploy'

    steps:
      - name: SSH and Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          envs: GITHUB_REF_NAME
          script_stop: true
          script: |
            set -e
            APP_DIR="/var/www/vidhyalayam"
            REPO_URL="https://github.com/i-manish-3/vidhyalayam-v1.0.git"
            BRANCH="${GITHUB_REF_NAME:-main}"

            echo "Triggering deployment for branch: ${BRANCH}"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Deployment directory is not a Git repository; initializing..."
              if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" /tmp/vidhyalayam.env.bak
              fi
              cd "$APP_DIR"
              git init
              git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL"
              git fetch origin "$BRANCH"
              git checkout -f -B "$BRANCH" "origin/$BRANCH"
              if [ -f /tmp/vidhyalayam.env.bak ]; then
                mv /tmp/vidhyalayam.env.bak "$APP_DIR/.env"
              fi
            fi

            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout -f -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            chmod +x scripts/deploy-azure.sh
            export DEPLOY_BRANCH="$BRANCH"
            ./scripts/deploy-azure.sh
