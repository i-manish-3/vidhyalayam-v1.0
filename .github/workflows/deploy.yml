name: Deploy Vidhyalayam to Azure VM

on:
  push:
    branches:
      - main
      - test-deploy
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Dry Run Build Verification
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  deploy-to-azure:
    name: Deploy to Azure Linux VM
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-deploy'

    steps:
      - name: SSH and Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          envs: GITHUB_REF_NAME
          script_stop: true
          script: |
            echo "Triggering deployment for branch: ${GITHUB_REF_NAME}"
            cd /var/www/vidhyalayam
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout "${GITHUB_REF_NAME}" || git checkout -b "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            chmod +x scripts/deploy-azure.sh
            export DEPLOY_BRANCH="${GITHUB_REF_NAME}"
            ./scripts/deploy-azure.sh
